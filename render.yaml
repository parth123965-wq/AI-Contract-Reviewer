services:
  - type: web
    name: ai-contract-reviewer-api
    runtime: docker
    plan: starter
    region: virginia
    rootDir: ./Backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    disk:
      name: contract-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: AI Contract Reviewer
      - key: APP_VERSION
        value: 2.0.0
      - key: DEBUG
        value: "false"
      - key: PRODUCTION
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: LOG_LEVEL
        value: INFO
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: contracts
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1
      - key: AI_MODEL_NAME
        value: gemini-1.5-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SEND_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: GMAIL_SENDER
        sync: false
      - key: OTP_LENGTH
        value: "6"
      - key: OTP_EXPIRE_SECONDS
        value: "300"
      - key: OTP_COOLDOWN_SECONDS
        value: "60"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: ALLOWED_ORIGINS
        value: https://ai-contract-reviewer.ai.studio
