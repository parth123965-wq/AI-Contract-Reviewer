version: '3.8'

services:
  # PostgreSQL Database Container
  db:
    image: postgres:15-alpine
    container_name: ai_contract_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: parth
      POSTGRES_DB: contract_reviewers
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_reviewers"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Container Service
  redis:
    image: redis:7-alpine
    container_name: ai_contract_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend & AI Engine Container
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ai_contract_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AI Contract Reviewer
      - APP_VERSION=1.0.0
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:parth@db:5432/contract_reviewers
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=kwomdg_secret_key_change_me
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - UPLOAD_DIR=uploads/contracts
      - LOG_LEVEL=INFO
      - MODEL_NAME=BAAI/bge-small-en-v1.5
      - COLLECTION_NAME=contracts
      - CHROMA_DB_PATH=ai_engine/vector_store
      - AI_MODEL_NAME=gemini-1.5-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-your_google_api_key_here}
    volumes:
      - uploads_data:/app/uploads
      - vector_store_data:/app/ai_engine/vector_store
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx Frontend Container
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ai_contract_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  vector_store_data:
