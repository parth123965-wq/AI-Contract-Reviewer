version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ai_contract_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: contract_reviewers
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_reviewers"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: ai_contract_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ai_contract_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/contract_reviewers
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
      - vector_store_data:/app/ai_engine/vector_store
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Worker Service (Uses same Backend Dockerfile!)
  celery_worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ai_contract_celery_worker
    command: celery -A app.core.celery_app worker --loglevel=info
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/contract_reviewers
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
      - vector_store_data:/app/ai_engine/vector_store
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # 5. Celery Beat Scheduler (Optional, for scheduled background tasks)
  celery_beat:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ai_contract_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis

  # 6. Nginx Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: ai_contract_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  vector_store_data:
