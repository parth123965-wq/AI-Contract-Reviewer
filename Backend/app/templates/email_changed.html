<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Email Changed - {{ app_name }}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { text-align: center; border-bottom: 1px solid #eeeeee; padding-bottom: 20px; }
        .content { padding: 20px 0; color: #333333; line-height: 1.6; }
        .alert { background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 12px; margin-top: 15px; border-radius: 4px; color: #991b1b; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #888888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Email Address Updated</h2>
        </div>
        <div class="content">
            <p>Hello <strong>{{ username }}</strong>,</p>
            <p>Your email address for <strong>{{ app_name }}</strong> has been successfully updated to <strong>{{ new_email }}</strong>.</p>
            <div class="alert">
                <p style="margin: 0;"><strong>Security Notice:</strong> If you did not request this change, please contact support immediately to secure your account.</p>
            </div>
        </div>
        <div class="footer">
            <p>&copy; {{ app_name }}. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
