<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OTP Verification Code</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { text-align: center; border-bottom: 1px solid #eeeeee; padding-bottom: 20px; }
        .otp-box { font-size: 36px; font-weight: bold; letter-spacing: 6px; color: #4F46E5; background-color: #EEF2FF; padding: 15px; text-align: center; border-radius: 6px; margin: 20px 0; }
        .content { color: #333333; line-height: 1.6; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #888888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>{{ app_name }} - Verification Code</h2>
        </div>
        <div class="content">
            <p>Use the following OTP verification code for <strong>{{ purpose }}</strong>:</p>
            <div class="otp-box">{{ otp_code }}</div>
            <p>This code is valid for <strong>{{ expire_minutes }} minutes</strong>.</p>
            <p>If you did not request this verification code, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; {{ app_name }}. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
